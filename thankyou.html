<style>
    .thank-you-section {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 40px 20px;
        position: relative;
        z-index: 10;
        font-family: 'Inter', sans-serif;
    }

    .success-icon-wrapper {
        position: relative;
        margin-bottom: 24px;
    }

    /* Recreating the orange box with green checkmark from screenshot */
    .success-box-icon {
        width: 64px;
        height: 64px;
        border: 4px solid #E69116; /* Orange border */
        border-radius: 4px; /* Slight rounding like screenshot */
        display: flex;
        align-items: center;
        justify-content: center;
        position: relative;
        background: rgba(230, 145, 22, 0.05);
    }

    .success-check {
        position: absolute;
        font-size: 80px;
        color: #3CD03C; /* Bright green */
        top: -20px;
        right: -10px;
        filter: drop-shadow(0 4px 10px rgba(60, 208, 60, 0.4));
        animation: popIn 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        opacity: 0;
        transform: scale(0.5);
    }

    @keyframes popIn {
        to {
            opacity: 1;
            transform: scale(1);
        }
    }

    .thank-you-title {
        font-size: clamp(28px, 4vw, 42px);
        font-weight: 800;
        margin-bottom: 24px;
        text-align: center;
        color: #fff;
    }

    .highlight-yellow {
        color: #F5C542;
    }

    .workshop-date-box {
        background: rgba(10, 5, 20, 0.8);
        border: 1px solid rgba(245, 197, 66, 0.5);
        border-radius: 12px;
        padding: 24px 40px;
        text-align: center;
        backdrop-filter: blur(12px);
        box-shadow: 0 10px 30px rgba(0,0,0,0.5), inset 0 0 20px rgba(245,197,66,0.05);
        margin-bottom: 30px;
        max-width: 600px;
        width: 100%;
    }

    .workshop-date-box h3 {
        font-size: clamp(20px, 3vw, 26px);
        color: #fff;
        margin-bottom: 8px;
        font-weight: 700;
    }

    .workshop-date-box p {
        font-size: clamp(18px, 2.5vw, 24px);
        color: #F5C542;
        font-weight: 700;
        margin: 0;
    }

    .whatsapp-prompt {
        font-size: clamp(18px, 2.5vw, 24px);
        color: #fff;
        font-weight: 700;
        margin-bottom: 24px;
        text-align: center;
    }

    .whatsapp-cta {
        background: #25D366; /* WhatsApp Green */
        color: #fff;
        font-size: 18px;
        font-weight: 800;
        padding: 16px 40px;
        border-radius: 8px;
        display: inline-flex;
        align-items: center;
        gap: 12px;
        text-decoration: none;
        transition: all 0.3s ease;
        box-shadow: 0 8px 24px rgba(37, 211, 102, 0.4);
    }

    .whatsapp-cta:hover {
        transform: translateY(-2px);
        box-shadow: 0 12px 30px rgba(37, 211, 102, 0.6);
        background: #20BD5A;
    }

    .whatsapp-cta i {
        font-size: 24px;
    }
</style>

<div class="thank-you-section">
    
    <div class="success-icon-wrapper">
        <div class="success-box-icon">
            <i class="fas fa-check success-check"></i>
        </div>
    </div>

    <h1 class="thank-you-title">
        <span class="highlight-yellow">Congratulations</span> For Registering!
    </h1>

    <div class="workshop-date-box reveal-up">
        <h3>Be Ready For The Workshop On</h3>
        <p>1st To 4th June At 8:30 PM</p>
    </div>

    <div class="whatsapp-prompt">
        Join The WhatsApp Group For Support & Updates
    </div>

    <a href="#" class="whatsapp-cta">
        <i class="fab fa-whatsapp"></i> WhatsApp Group
    </a>

</div>
